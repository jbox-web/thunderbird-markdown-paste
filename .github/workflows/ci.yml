name: CI

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  # Thunderbird moves on its own: catch an editor or API change without a commit.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: xpi
          path: dist/*.xpi

  # Undo can only be proven in the real editor: jsdom has none.
  # Linux only: on GitHub's macOS runners, Marionette never answers NewSession.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install Thunderbird
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y libgtk-3-0t64 libasound2t64 libdbus-glib-1-2 libx11-xcb1
          curl -fsSL -o thunderbird.tar "https://download.mozilla.org/?product=thunderbird-latest&os=linux64&lang=en-US"
          mkdir "$RUNNER_TEMP/tb"
          tar xf thunderbird.tar -C "$RUNNER_TEMP/tb"
          rm thunderbird.tar
      - run: npm run e2e
        timeout-minutes: 10
        env:
          THUNDERBIRD_BIN: ${{ runner.temp }}/tb/thunderbird/thunderbird
